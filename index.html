<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Site Preview AR Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 15% 20%, rgba(255, 71, 87, 0.18), transparent 32%),
             radial-gradient(circle at 80% 10%, rgba(0, 255, 235, 0.14), transparent 28%),
             #05070d;
      --panel: rgba(12, 14, 22, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef1f7;
      --muted: #a7b0c4;
      --accent: #ff2d55;
      --accent-2: #38f8d6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #0b0b12;
      font-family: "Space Grotesk", "Helvetica Neue", sans-serif;
    }
    #ui {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #gate {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }
    #ar-btn {
      appearance: none;
      border: 1px solid rgba(255, 45, 85, 0.55);
      background: linear-gradient(135deg, #ff2d55, #f767ac);
      color: #0b0b12;
      font-weight: 700;
      font-size: 15px;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255, 45, 85, 0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      pointer-events: auto;
    }
    #ar-btn:hover { transform: translateY(-1px); box-shadow: 0 16px 34px rgba(255, 45, 85, 0.5); }
    #ar-btn:active { transform: translateY(0); box-shadow: 0 12px 30px rgba(255, 45, 85, 0.35); }
    #gate h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    #gate p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }
    .unsupported {
      display: none;
      margin-top: 10px;
      background: rgba(255, 119, 0, 0.18);
      border: 1px solid rgba(255, 119, 0, 0.5);
      color: #ffd7b3;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .unsupported.show { display: block; }
    #unsupported a { color: #ffd7b3; text-decoration: underline; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="gate">
    <h1>버튼을 누르시면 AR 콘텐츠가 시작됩니다.</h1>
    <p>카메라 권한 필요 · 두 손가락 핀치로 크기 조정, 한 손가락 드래그로 이동</p>
    <button id="ar-btn">AR 시작</button>
    <div id="unsupported" class="unsupported"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    let camera, scene, renderer;
    let previewMesh = null;
    let xrSession = null;
    let hasPlacedOnce = false;

    const up = new THREE.Vector3(0, 1, 0);
    const lookMat = new THREE.Matrix4();
    const initialDepth = 1.0; // meters in front of camera
    const previewScale = { base: 0.9, current: 0.9 }; // meters for width

    const activePointers = new Map();
    const tmpVec = new THREE.Vector3();
    const tmpVec2 = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();

    const gateEl = document.getElementById('gate');
    const startBtn = document.getElementById('ar-btn');
    const unsupportedEl = document.getElementById('unsupported');

    const showUnsupported = (msg) => {
      unsupportedEl.textContent = msg;
      unsupportedEl.classList.add('show');
    };

    startBtn.addEventListener('click', () => {
      startARSession().catch((err) => {
        console.error(err);
        waitForUserTap();
      });
    });

    init();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 1.1);
      scene.add(hemi);

      // Load the preview image as a textured plane
      new THREE.TextureLoader().load('./site_preview.png', (texture) => {
        const aspect = texture.image.width / texture.image.height;
        const widthMeters = previewScale.base;
        const heightMeters = widthMeters / aspect;
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          transparent: true
        });
        const geometry = new THREE.PlaneGeometry(widthMeters, heightMeters);
        previewMesh = new THREE.Mesh(geometry, material);
        previewMesh.visible = false;
        scene.add(previewMesh);
      });

      // Wait for explicit button tap to start
      window.addEventListener('resize', onWindowResize);
      animate();
    }

    async function startARSession() {
      if (xrSession) return xrSession;
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local'],
        optionalFeatures: ['local-floor', 'dom-overlay'],
        domOverlay: { root: document.body }
      });
      xrSession = session;
      session.addEventListener('end', onSessionEnd);
      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
      hasPlacedOnce = false;
      attachGestures();
      gateEl.style.display = 'none';
      if (previewMesh) {
        placeFront(initialDepth);
        previewMesh.scale.setScalar(previewScale.current / previewScale.base);
      }
      return session;
    }

    function onSessionEnd() {
      xrSession = null;
      if (previewMesh) previewMesh.visible = false;
      gateEl.style.display = 'flex';
    }

    function waitForUserTap() {
      const tapHandler = () => {
        window.removeEventListener('touchend', tapHandler);
        window.removeEventListener('click', tapHandler);
        startARSession().catch((err) => {
          console.error(err);
          waitForUserTap();
        });
      };
      window.addEventListener('touchend', tapHandler, { once: true });
      window.addEventListener('click', tapHandler, { once: true });
    }

    function placeFront(distance) {
      if (!previewMesh) return;
      tmpVec.set(0, 0, -distance).applyQuaternion(camera.quaternion).add(camera.position);
      previewMesh.position.copy(tmpVec);
      previewMesh.quaternion.copy(camera.quaternion);
      previewMesh.rotateY(Math.PI);
      previewMesh.visible = true;
      hasPlacedOnce = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      renderer.render(scene, camera);
    }

    function attachGestures() {
      const el = renderer.domElement;
      el.style.touchAction = 'none';

      el.addEventListener('pointerdown', onPointerDown);
      el.addEventListener('pointermove', onPointerMove);
      el.addEventListener('pointerup', onPointerUp);
      el.addEventListener('pointercancel', onPointerUp);
      el.addEventListener('pointerout', onPointerUp);
      el.addEventListener('pointerleave', onPointerUp);
    }

    function onPointerDown(e) {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (previewMesh && activePointers.size === 1) {
        if (hitPreview(e)) {
          window.open('https://www.infocus1.co.kr', '_blank');
          return;
        }
      }
      if (!xrSession) return;
      if (activePointers.size === 1 && previewMesh) {
        placeFront(initialDepth);
      }
    }

    function onPointerUp(e) {
      activePointers.delete(e.pointerId);
      onPointerMove.startDist = undefined;
      onPointerMove.startScale = undefined;
    }

    function onPointerMove(e) {
      if (!previewMesh || activePointers.size === 0) return;
      if (!activePointers.has(e.pointerId)) return;

      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const points = Array.from(activePointers.values());

      if (points.length === 1) {
        // drag: move along the camera-facing plane keeping current distance
        const distance = previewMesh.position.distanceTo(camera.position) || initialDepth;
        const { x, y } = points[0];
        updatePositionFromScreen(x, y, distance);
      } else if (points.length >= 2) {
        // pinch: scale based on first two pointers
        const [p1, p2] = points;
        if (!onPointerMove.startDist) {
          onPointerMove.startDist = dist(p1, p2);
          onPointerMove.startScale = previewScale.current;
        }
        const factor = dist(p1, p2) / onPointerMove.startDist;
        previewScale.current = clamp(onPointerMove.startScale * factor, 0.3, 2.5);
        previewMesh.scale.setScalar(previewScale.current / previewScale.base);
      }
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, val));
    }

    function updatePositionFromScreen(clientX, clientY, distance) {
      const rect = renderer.domElement.getBoundingClientRect();
      const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
      const ndcY = -(((clientY - rect.top) / rect.height) * 2 - 1);
      tmpVec.set(ndcX, ndcY, 0.5);
      tmpVec.unproject(camera);
      tmpVec.sub(camera.position).normalize();
      tmpVec.multiplyScalar(distance);
      previewMesh.position.copy(camera.position).add(tmpVec);

      // keep facing the camera
      tmpQuat.setFromRotationMatrix(lookMat.lookAt(previewMesh.position, camera.position, up));
      previewMesh.quaternion.copy(tmpQuat);
      previewMesh.rotateY(Math.PI);
      hasPlacedOnce = true;
    }

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    function hitPreview(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
      raycaster.setFromCamera(pointerNDC, camera);
      const hit = raycaster.intersectObject(previewMesh, true);
      return hit.length > 0;
    }
  </script>
</body>
</html>
