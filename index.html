<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Site Preview AR Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 15% 20%, rgba(255, 71, 87, 0.18), transparent 32%),
             radial-gradient(circle at 80% 10%, rgba(0, 255, 235, 0.14), transparent 28%),
             #05070d;
      --panel: rgba(12, 14, 22, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef1f7;
      --muted: #a7b0c4;
      --accent: #ff2d55;
      --accent-2: #38f8d6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", "Helvetica Neue", sans-serif;
    }
    #ui {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff8a00);
      box-shadow: 0 0 10px rgba(255, 45, 85, 0.9);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    p.lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-top: 6px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.03);
    }
    .chip.accent {
      color: var(--text);
      border-color: rgba(255, 45, 85, 0.4);
      background: rgba(255, 45, 85, 0.14);
    }
    #cta {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    #ar-btn {
      appearance: none;
      border: 1px solid rgba(255, 45, 85, 0.55);
      background: linear-gradient(135deg, #ff2d55, #f767ac);
      color: #0b0b12;
      font-weight: 700;
      font-size: 15px;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255, 45, 85, 0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      pointer-events: auto;
    }
    #ar-btn:hover { transform: translateY(-1px); box-shadow: 0 16px 34px rgba(255, 45, 85, 0.5); }
    #ar-btn:active { transform: translateY(0); box-shadow: 0 12px 30px rgba(255, 45, 85, 0.35); }
    #status {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text);
    }
    #status small { color: var(--muted); display: block; margin-top: 2px; }
    .tips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .tip {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .tip strong { color: var(--text); }
    .unsupported {
      display: none;
      margin-top: 10px;
      background: rgba(255, 119, 0, 0.18);
      border: 1px solid rgba(255, 119, 0, 0.5);
      color: #ffd7b3;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .unsupported.show { display: block; }
    #unsupported a { color: #ffd7b3; text-decoration: underline; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="panel">
      <div class="brand"><span class="dot"></span> Image AR · WebXR</div>
      <h1>site_preview.png을 공간에 띄우기</h1>
      <p class="lead">페이지가 열리면 곧바로 카메라가 켜집니다. 손가락 두 개로 크기 조절, 한 손가락으로 끌어다 위치를 옮기세요.</p>
      <div class="chips">
        <span class="chip accent">site_preview.png · 1000×545</span>
        <span class="chip">Pinch to scale</span>
        <span class="chip">Drag to move</span>
      </div>
      <div id="status">AR 준비 중...</div>
      <div id="unsupported" class="unsupported"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    let camera, scene, renderer;
    let previewMesh = null;
    let xrSession = null;
    let hasPlacedOnce = false;

    const up = new THREE.Vector3(0, 1, 0);
    const lookMat = new THREE.Matrix4();
    const initialDepth = 1.0; // meters in front of camera
    const previewScale = { base: 0.9, current: 0.9 }; // meters for width

    const activePointers = new Map();
    const tmpVec = new THREE.Vector3();
    const tmpVec2 = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();

    const statusEl = document.getElementById('status');
    const unsupportedEl = document.getElementById('unsupported');

    const setStatus = (msg) => { statusEl.textContent = msg; };
    const showUnsupported = (msg) => {
      unsupportedEl.textContent = msg;
      unsupportedEl.classList.add('show');
    };

    init();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 1.1);
      scene.add(hemi);

      // Load the preview image as a textured plane
      new THREE.TextureLoader().load('./site_preview.png', (texture) => {
        const aspect = texture.image.width / texture.image.height;
        const widthMeters = previewScale.base;
        const heightMeters = widthMeters / aspect;
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          transparent: true
        });
        const geometry = new THREE.PlaneGeometry(widthMeters, heightMeters);
        previewMesh = new THREE.Mesh(geometry, material);
        previewMesh.visible = false;
        scene.add(previewMesh);
      });

      checkAndStart();
      window.addEventListener('resize', onWindowResize);
      animate();
    }

    async function checkAndStart() {
      if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar'))) {
        showUnsupported('이 브라우저는 WebXR AR을 지원하지 않습니다. Android 크롬 최신 버전·HTTPS에서 열어주세요.');
        return;
      }
      setStatus('AR 세션을 시작합니다...');
      try {
        await startARSession();
      } catch (err) {
        console.warn('Auto-start blocked, waiting for tap', err);
        setStatus('화면을 한번 탭하면 AR이 시작됩니다.');
        waitForUserTap();
      }
    }

    async function startARSession() {
      if (xrSession) return xrSession;
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local'],
        optionalFeatures: ['local-floor', 'dom-overlay'],
        domOverlay: { root: document.body }
      });
      xrSession = session;
      session.addEventListener('end', onSessionEnd);
      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
      hasPlacedOnce = false;
      attachGestures();
      if (previewMesh) {
        placeFront(initialDepth);
        previewMesh.scale.setScalar(previewScale.current / previewScale.base);
      }
      setStatus('핀치로 크기 조정, 드래그로 이동하세요.');
      return session;
    }

    function onSessionEnd() {
      xrSession = null;
      if (previewMesh) previewMesh.visible = false;
      setStatus('세션이 종료되었습니다. 화면을 탭하면 다시 시작합니다.');
      waitForUserTap();
    }

    function waitForUserTap() {
      const tapHandler = () => {
        window.removeEventListener('touchend', tapHandler);
        window.removeEventListener('click', tapHandler);
        startARSession().catch((err) => {
          console.error(err);
          setStatus('AR 시작이 차단되었습니다. 한 번 더 탭해주세요.');
          waitForUserTap();
        });
      };
      window.addEventListener('touchend', tapHandler, { once: true });
      window.addEventListener('click', tapHandler, { once: true });
    }

    function placeFront(distance) {
      if (!previewMesh) return;
      tmpVec.set(0, 0, -distance).applyQuaternion(camera.quaternion).add(camera.position);
      previewMesh.position.copy(tmpVec);
      previewMesh.quaternion.copy(camera.quaternion);
      previewMesh.rotateY(Math.PI);
      previewMesh.visible = true;
      hasPlacedOnce = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      renderer.render(scene, camera);
    }

    function attachGestures() {
      const el = renderer.domElement;
      el.style.touchAction = 'none';

      el.addEventListener('pointerdown', onPointerDown);
      el.addEventListener('pointermove', onPointerMove);
      el.addEventListener('pointerup', onPointerUp);
      el.addEventListener('pointercancel', onPointerUp);
      el.addEventListener('pointerout', onPointerUp);
      el.addEventListener('pointerleave', onPointerUp);
    }

    function onPointerDown(e) {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (!xrSession) return;
      if (activePointers.size === 1 && previewMesh) {
        placeFront(initialDepth);
      }
    }

    function onPointerUp(e) {
      activePointers.delete(e.pointerId);
    }

    function onPointerMove(e) {
      if (!previewMesh || activePointers.size === 0) return;
      if (!activePointers.has(e.pointerId)) return;

      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const points = Array.from(activePointers.values());

      if (points.length === 1) {
        // drag: move along the camera-facing plane keeping current distance
        const distance = previewMesh.position.distanceTo(camera.position) || initialDepth;
        const { x, y } = points[0];
        updatePositionFromScreen(x, y, distance);
      } else if (points.length >= 2) {
        // pinch: scale based on first two pointers
        const [p1, p2] = points;
        if (!onPointerMove.startDist) {
          onPointerMove.startDist = dist(p1, p2);
          onPointerMove.startScale = previewScale.current;
        }
        const factor = dist(p1, p2) / onPointerMove.startDist;
        previewScale.current = clamp(onPointerMove.startScale * factor, 0.3, 2.5);
        previewMesh.scale.setScalar(previewScale.current / previewScale.base);
      }
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, val));
    }

    function updatePositionFromScreen(clientX, clientY, distance) {
      const rect = renderer.domElement.getBoundingClientRect();
      const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
      const ndcY = -(((clientY - rect.top) / rect.height) * 2 - 1);
      tmpVec.set(ndcX, ndcY, 0.5);
      tmpVec.unproject(camera);
      tmpVec.sub(camera.position).normalize();
      tmpVec.multiplyScalar(distance);
      previewMesh.position.copy(camera.position).add(tmpVec);

      // keep facing the camera
      tmpQuat.setFromRotationMatrix(lookMat.lookAt(previewMesh.position, camera.position, up));
      previewMesh.quaternion.copy(tmpQuat);
      previewMesh.rotateY(Math.PI);
      hasPlacedOnce = true;
    }
  </script>
</body>
</html>
